name: CPU correctness
on: [push, pull_request]
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements-cpu.txt
      - run: OMP_NUM_THREADS=1 MKL_NUM_THREADS=1 python -m pytest -q
      - run: python scripts/verify_geometry.py
